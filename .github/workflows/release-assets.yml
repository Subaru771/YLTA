name: Build companion ZIPs for GitHub Releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v1.0)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract matching release-tag source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --tags
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          mkdir -p /tmp/ylta-release-source
          git archive "refs/tags/$RELEASE_TAG" | tar -xf - -C /tmp/ylta-release-source
      - name: Build and verify deterministic source archives and checksums
        run: |
          # v1.0 predates LICENSE; newer release tags should contain their own LICENSE.
          if [ -f /tmp/ylta-release-source/LICENSE ]; then
            LICENSE_PATH=/tmp/ylta-release-source/LICENSE
          else
            LICENSE_PATH="$GITHUB_WORKSPACE/LICENSE"
          fi
          python scripts/build-release-archives.py --source-root /tmp/ylta-release-source --output-dir dist --license-file "$LICENSE_PATH"
          python scripts/build-release-archives.py --source-root /tmp/ylta-release-source --output-dir dist --license-file "$LICENSE_PATH" --verify-only
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Upload ZIPs and checksums to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" dist/ylta-psn-sync-kit.zip dist/ylta-psnprofiles-browser-helper.zip dist/SHA256SUMS.txt --clobber
