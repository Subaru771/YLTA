name: Actions storage housekeeping

on:
  push:
    paths:
      - '.github/workflows/storage-housekeeping.yml'
  workflow_dispatch:
  schedule:
    - cron: '21 4 * * 0'

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-housekeeping
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Remove redundant runs and temporary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections, datetime, json, os, time, urllib.error, urllib.request
          
          repo = os.environ["GITHUB_REPOSITORY"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          
          def call(path, method="GET"):
              for retry in range(3):
                  req = urllib.request.Request("https://api.github.com" + path, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          payload = response.read()
                          return json.loads(payload) if payload else {}
                  except urllib.error.HTTPError as exc:
                      if method == "DELETE" and exc.code == 404:
                          return {}
                      if exc.code in (403, 429, 502, 503) and retry < 2:
                          delay = min(int(exc.headers.get("Retry-After", "20")), 60)
                          print("GitHub API backoff:", exc.code, "waiting", delay, "seconds", flush=True)
                          time.sleep(delay)
                          continue
                      raise
          
          def list_all(path, field):
              items = []
              page = 1
              while True:
                  join = "&" if "?" in path else "?"
                  payload = call(path + join + "per_page=100&page=" + str(page))
                  batch = payload.get(field, [])
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  page += 1
          
          prefix = "/repos/" + repo + "/actions"
          runs = list_all(prefix + "/runs", "workflow_runs")
          artifacts = list_all(prefix + "/artifacts", "artifacts")
          workflows = list_all(prefix + "/workflows", "workflows")
          active_workflow_ids = {w["id"] for w in workflows if w.get("state") == "active"}
          by_workflow = collections.defaultdict(list)
          for run in runs:
              by_workflow[run.get("workflow_id")].append(run)
          
          keep_runs = {current_run}
          for workflow_id, group in by_workflow.items():
              group.sort(key=lambda x: x.get("created_at", ""), reverse=True)
              if workflow_id in active_workflow_ids:
                  keep_runs.update(r["id"] for r in group[:2])
              successful = next((r for r in group if r.get("conclusion") == "success"), None)
              if successful and (workflow_id in active_workflow_ids or
                                 any(word in (successful.get("name") or "").lower()
                                     for word in ("publish", "release"))):
                  keep_runs.add(successful["id"])
          
          cutoff = (datetime.datetime.now(datetime.timezone.utc)
                    - datetime.timedelta(days=3)).strftime("%Y-%m-%dT%H:%M:%SZ")
          fresh = sorted((a for a in artifacts if a.get("created_at", "") >= cutoff),
                         key=lambda a: a.get("created_at", ""), reverse=True)
          keep_artifact_ids = {a["id"] for a in fresh[:2]}
          for artifact in fresh[:2]:
              associated = (artifact.get("workflow_run") or {}).get("id")
              if associated:
                  keep_runs.add(associated)
          
          victims = [r for r in runs if r.get("status") == "completed" and r["id"] not in keep_runs]
          print("Discovered", len(runs), "runs and", len(artifacts),
                "artifacts. Removing", len(victims), "obsolete completed runs.", flush=True)
          removed_runs = 0
          for run in victims:
              call(prefix + "/runs/" + str(run["id"]), "DELETE")
              removed_runs += 1
              time.sleep(0.15)
          
          remaining_artifacts = list_all(prefix + "/artifacts", "artifacts")
          removed_artifacts = 0
          freed_bytes = 0
          for artifact in remaining_artifacts:
              if artifact["id"] not in keep_artifact_ids:
                  call(prefix + "/artifacts/" + str(artifact["id"]), "DELETE")
                  removed_artifacts += 1
                  freed_bytes += artifact.get("size_in_bytes", 0)
                  time.sleep(0.15)
          
          print("Completed:", removed_runs, "old runs deleted;",
                removed_artifacts, "remaining redundant artifacts deleted;",
                round(freed_bytes / (1024*1024), 1), "MB of directly deleted artifacts.",
                "GitHub Releases were not touched.", flush=True)
          PY
