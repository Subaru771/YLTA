name: Vendor local Open Font License fonts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WOFF2 converter
        run: python -m pip install "fonttools[woff]==4.60.1"
      - name: Vendor pinned, OFL-licensed fonts
        run: python scripts/vendor-fonts.py
      - name: Commit bundled fonts and legal notices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts
          if git diff --cached --quiet; then
            echo "Font files unchanged"
          else
            git commit -m "assets: self-host OFL font families as WOFF2"
            git push origin HEAD:main
          fi
