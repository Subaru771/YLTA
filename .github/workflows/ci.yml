name: YLTA checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Source and import checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          for file in js/*.js mobile-server/*.mjs tools/windows-exporter/*.mjs tools/psnprofiles-helper/*.js; do
            node --check "$file"
          done
      - name: Verify reproducible companion ZIP packaging
        run: |
          python3 scripts/build-release-archives.py
          python3 scripts/build-release-archives.py --verify-only
      - name: Run source and import regression tests
        run: node --test tests/*.test.cjs tests/*.test.mjs
